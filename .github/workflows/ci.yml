name: ci

on:
  pull_request:
  push:
    branches: [main, staging]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: marketplace_test
          POSTGRES_PASSWORD: marketplace_test
          POSTGRES_DB: marketplace_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U marketplace_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      MARKETPLACE_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      MARKETPLACE_TEST_POSTGRES_URL: postgres://marketplace_test:marketplace_test@127.0.0.1:5432/marketplace_test?sslmode=disable
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
      - run: go test -race ./...
      - run: go vet ./...

  backoffice-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backoffice-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:shipping-dates
      - run: npm run test:transfer-reference
      - run: npm run test:persian-dates
      - run: npm run build

  seller-portal-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/seller-portal-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  storefront-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/storefront-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:display-numbers
      - run: npm run test:order-progress
      - run: npm run test:shipping-presentation
      - run: npm run test:persian-dates
      - run: npm run build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
